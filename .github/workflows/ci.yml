name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          # Broker + Telegram are fully mocked in tests — dummy values prevent
          # any accidental real API calls while satisfying import-time env checks.
          ALPACA_API_KEY: ci-dummy
          ALPACA_SECRET_KEY: ci-dummy
          ALPACA_PAPER: "true"
          TELEGRAM_BOT_TOKEN: ci-dummy
          TELEGRAM_CHAT_ID: "0"
          DRY_RUN: "true"
